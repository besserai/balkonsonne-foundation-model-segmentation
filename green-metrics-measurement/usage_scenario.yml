name: Energy Measurement SAM3 Sky Mask Prediction
author: envite Consulting GmbH <ruessmann|wittrowski|kepes@envite.de>
description: Green Metrics usage_scenario for predict_only_without_app (SAM3 sky mask inference)

compose-file: !include docker-compose.yml

services:
  gcb-sam3-predictor:
    docker-run-args:
      - --gpus=all
    folder-destination: /workspace/predict_only_without_app

flow:
  - name: Clean output
    container: gcb-sam3-predictor
    commands:
      - type: console
        command: rm -f /tmp/testPanorama_mask.png
        read-notes-stdout: true
        log-stdout: true

  - name: Download model
    container: gcb-sam3-predictor
    commands:
      - type: console
        command: huggingface-cli download facebook/sam3
        read-notes-stdout: true
        log-stdout: true

  - name: Run single pipeline simulation (run 1)
    container: gcb-sam3-predictor
    commands:
      - type: console
        command: python predict_single_pipeline_run.py --model-dir facebook/sam3 --output-image /tmp/testPanorama_mask.png
        read-notes-stdout: true
        log-stdout: true

  - name: Run single pipeline simulation (run 2)
    container: gcb-sam3-predictor
    commands:
      - type: console
        command: python predict_single_pipeline_run.py --model-dir facebook/sam3 --output-image /tmp/testPanorama_mask.png
        read-notes-stdout: true
        log-stdout: true